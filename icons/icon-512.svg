<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="4" />

  <!-- Dynamic Equalizer Waves in Background -->
  <g opacity="0.35" transform="translate(56, 310)">
    <rect x="0" y="30" width="16" height="50" rx="8" fill="url(#waveGrad)" />
    <rect x="28" y="10" width="16" height="70" rx="8" fill="url(#waveGrad)" />
    <rect x="56" y="40" width="16" height="40" rx="8" fill="url(#waveGrad)" />
    <rect x="84" y="0" width="16" height="80" rx="8" fill="url(#waveGrad)" />
    <rect x="112" y="25" width="16" height="55" rx="8" fill="url(#waveGrad)" />
    
    <rect x="260" y="25" width="16" height="55" rx="8" fill="url(#waveGrad)" />
    <rect x="288" y="0" width="16" height="80" rx="8" fill="url(#waveGrad)" />
    <rect x="316" y="40" width="16" height="40" rx="8" fill="url(#waveGrad)" />
    <rect x="344" y="10" width="16" height="70" rx="8" fill="url(#waveGrad)" />
    <rect x="372" y="30" width="16" height="50" rx="8" fill="url(#waveGrad)" />
  </g>

  <!-- Glowing Aura for the Cross -->
  <circle cx="256" cy="220" r="130" fill="#3b82f6" opacity="0.15" filter="url(#glow)" />

  <!-- EJC Golden Cross -->
  <g filter="url(#glow)">
    <!-- Vertical beam -->
    <rect x="238" y="100" width="36" height="230" rx="8" fill="url(#crossGrad)" />
    <!-- Horizontal beam -->
    <rect x="180" y="160" width="152" height="36" rx="8" fill="url(#crossGrad)" />
  </g>

  <!-- Center Heart / Star of Lourdes -->
  <circle cx="256" cy="178" r="14" fill="#ffffff" opacity="0.9" />

  <!-- Sound Waves coming from center -->
  <path d="M 200 178 A 56 56 0 0 1 200 130" fill="none" stroke="#60a5fa" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <path d="M 312 178 A 56 56 0 0 0 312 130" fill="none" stroke="#60a5fa" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <path d="M 180 190 A 80 80 0 0 1 180 118" fill="none" stroke="#93c5fd" stroke-width="6" stroke-linecap="round" opacity="0.6" />
  <path d="M 332 190 A 80 80 0 0 0 332 118" fill="none" stroke="#93c5fd" stroke-width="6" stroke-linecap="round" opacity="0.6" />

  <!-- Subtitle Typography -->
  <text x="256" y="415" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">
    eJC DE LOURDES
  </text>
  <text x="256" y="445" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#60a5fa" text-anchor="middle" letter-spacing="4">
    SONOPLASTIA &amp; TEATRO
  </text>
</svg>
